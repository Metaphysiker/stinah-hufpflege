name: stinah-hufpflege-development
services:
  webapi:
    build:
      context: ../../WebApi
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT_BACKEND}:8080"
    env_file:
      - .env
    #entrypoint: sh -c "cd WebApi && dotnet ef database update"
    depends_on:
      postgres:
        condition: service_healthy
  vue:
    build:
      context: ../../vue-app
      dockerfile: Dockerfile
      target: development-stage
      args:
        VITE_API_BASE_URL: "${API_BASE_URL}"
    restart: unless-stopped
    volumes:
      - ../../vue-app/src:/app/src
    env_file:
      - .env
    ports:
      - "${PORT_FRONTEND}:8080"
    depends_on:
      - webapi
  dotnet:
    build: ../../tools/dotnet
    volumes:
      - ../../:/app
    env_file:
      - .env
    #entrypoint: sh -c "cd WebApi && dotnet ef database update"
    depends_on:
      - webapi
  npm:
    build: ../../tools/npm
    volumes:
      - ../../:/app
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres-data:
